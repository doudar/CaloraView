name: Desktop build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            command: npm run dist:win -- --x64 --publish never
          - os: macos-latest
            platform: mac-arm64
            command: npm run dist:mac -- --arm64 --publish never
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm test
      - name: Build distributable
        shell: bash
        run: ${{ matrix.command }}
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1
      - name: Verify macOS package installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          installers=(dist/*-Installer.pkg)
          test "${#installers[@]}" -eq 1
          sudo installer -allowUntrusted -pkg "${installers[0]}" -target /
          node scripts/verify-package.cjs '/Applications/Caloraview Desktop.app/Contents/Resources/app.asar'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/*-Setup.exe
            dist/*-Installer.pkg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
